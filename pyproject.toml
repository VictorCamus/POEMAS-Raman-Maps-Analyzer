[project]
name = "poemas-repository"
version = "0.1.0"
description = "POEMAS Repository"
requires-python = ">=3.14, <3.15"
dependencies = [
    "h5py>=3.16,<4",
    "lmfit>=1.3.4",
    "matplotlib>=3.10,<4.0",
    "numpy>=2.3,<3.0",
    "pybaselines>=1.2",
    "pywin32>=312; sys_platform == 'win32'",
    "scipy>=1.16",
]

[dependency-groups]
dev = [
    "h5py-stubs>=0.1.2",
    "types-pywin32>=312",
    "mypy>=2.4",
    "ruff",
    "ty>=0.0.84",
    "scipy-stubs>=1.18.1.1",
]

# ============================================================
# MYPY
# ============================================================

[tool.mypy]
python_version = "3.14"

# Preset oficial de màxima estrictesa
strict = true

# Comprovacions addicionals que strict no activa
warn_unreachable = true
warn_unused_configs = true
strict_equality_for_none = true

# Fer explícit que no volem Any innecessari
disallow_any_unimported = true
disallow_any_decorated = true
disallow_any_explicit = true

# ============================================================
# RUFF
# ============================================================

[tool.ruff]
target-version = "py314"
line-length = 120
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "magic-value-comparison", # Use of arbitrary numbers
    "missing-copyright-notice", # Not copyright license at the start
    "too-many-arguments",  # Too many arguments in function definition
    "too-many-positional-arguments",  # Too many positional arguments
    "incorrect-blank-line-before-class", 
    "multi-line-summary-second-line"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# ty
# ============================================================

[tool.ty]
[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"

# Poden produir bastants falsos positius.
division-by-zero = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true
